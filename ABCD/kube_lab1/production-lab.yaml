apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-web
  labels:
    tier: frontend
    env: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Only allow 1 extra pod above desired replicas during update
      maxUnavailable: 0  # Ensure ZERO pods are taken offline before new ones are ready
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      containers:
      - name: nginx
        image: nginx:1.24.0-alpine  # Strict tag, no 'latest'
        ports:
        - containerPort: 80
        resources:                  # Strict resource boundaries
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:              # Auto-heal if container freezes
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:             # Only receive traffic when fully ready
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-web-service
spec:
  type: LoadBalancer              # Exposes to localhost on Docker Desktop
  selector:
    app: web-server
  ports:
    - protocol: TCP
      port: 8088                  # External port
      targetPort: 80              # Container port